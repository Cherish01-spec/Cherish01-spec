<svg xmlns="http://www.w3.org/2000/svg" width="370" height="320" viewBox="0 0 370 320">
<title>Animated ASCII terminal art for Cherish Kumar Satpathy</title>
<style>
  .bg { fill: #0d1117; }
  .text { font-family: "Courier New", Courier, monospace; font-size: 13px; fill: #58a6ff; font-weight: bold; white-space: pre; }
  .cursor { fill: #39d353; }
</style>
<rect width="100%" height="100%" class="bg" rx="10"/>
<g transform="translate(25, 45)">
<text x="0" y="0" class="text">       .-----------------------.</text>
<rect x="0" y="-12" width="320" height="18" fill="#0d1117"><animate attributeName="x" from="0" to="320" dur="0.4s" begin="0.20s" fill="freeze" /></rect>
<text x="0" y="19" class="text">       |  cherish@dev:~$ _     |</text>
<rect x="0" y="7" width="320" height="18" fill="#0d1117"><animate attributeName="x" from="0" to="320" dur="0.4s" begin="0.32s" fill="freeze" /></rect>
<text x="0" y="38" class="text">       |                       |</text>
<rect x="0" y="26" width="320" height="18" fill="#0d1117"><animate attributeName="x" from="0" to="320" dur="0.4s" begin="0.44s" fill="freeze" /></rect>
<text x="0" y="57" class="text">       |  &gt; C O D E            |</text>
<rect x="0" y="45" width="320" height="18" fill="#0d1117"><animate attributeName="x" from="0" to="320" dur="0.4s" begin="0.56s" fill="freeze" /></rect>
<text x="0" y="76" class="text">       |  &gt; L O G I C          |</text>
<rect x="0" y="64" width="320" height="18" fill="#0d1117"><animate attributeName="x" from="0" to="320" dur="0.4s" begin="0.68s" fill="freeze" /></rect>
<text x="0" y="95" class="text">       |  &gt; C R E A T I O N    |</text>
<rect x="0" y="83" width="320" height="18" fill="#0d1117"><animate attributeName="x" from="0" to="320" dur="0.4s" begin="0.80s" fill="freeze" /></rect>
<text x="0" y="114" class="text">       |                       |</text>
<rect x="0" y="102" width="320" height="18" fill="#0d1117"><animate attributeName="x" from="0" to="320" dur="0.4s" begin="0.92s" fill="freeze" /></rect>
<text x="0" y="133" class="text">       &#x27;-----------------------&#x27;</text>
<rect x="0" y="121" width="320" height="18" fill="#0d1117"><animate attributeName="x" from="0" to="320" dur="0.4s" begin="1.04s" fill="freeze" /></rect>
<text x="0" y="152" class="text">           /               \</text>
<rect x="0" y="140" width="320" height="18" fill="#0d1117"><animate attributeName="x" from="0" to="320" dur="0.4s" begin="1.16s" fill="freeze" /></rect>
<text x="0" y="171" class="text">          /                 \</text>
<rect x="0" y="159" width="320" height="18" fill="#0d1117"><animate attributeName="x" from="0" to="320" dur="0.4s" begin="1.28s" fill="freeze" /></rect>
<text x="0" y="190" class="text">         /                   \</text>
<rect x="0" y="178" width="320" height="18" fill="#0d1117"><animate attributeName="x" from="0" to="320" dur="0.4s" begin="1.40s" fill="freeze" /></rect>
<text x="0" y="209" class="text">        &#x27;---------------------&#x27;</text>
<rect x="0" y="197" width="320" height="18" fill="#0d1117"><animate attributeName="x" from="0" to="320" dur="0.4s" begin="1.52s" fill="freeze" /></rect>
<text x="0" y="228" class="text">        [Cherish Kumar Satpathy]</text>
<rect x="0" y="216" width="320" height="18" fill="#0d1117"><animate attributeName="x" from="0" to="320" dur="0.4s" begin="1.64s" fill="freeze" /></rect>
<rect x="304" y="1" width="7" height="16" class="cursor" opacity="0.9"><animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite" /></rect>
</g></svg>